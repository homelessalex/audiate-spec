# Generates Audiate.xcodeproj:  xcodegen generate
name: Audiate
options:
  bundleIdPrefix: app.audiate
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  AudiateCore:
    path: Packages/AudiateCore
  AudiateAudio:
    path: Packages/AudiateAudio
targets:
  Audiate:
    type: application
    platform: macOS
    sources:
      - App
      # data/ stays the single source of truth (generated by tools/build_patterns.py)
      - path: data/patterns.json
        buildPhase: resources
      - path: data/cells.json
        buildPhase: resources
      - path: data/curriculum.json
        buildPhase: resources
      - path: Resources/Fonts/Bravura.otf
        buildPhase: resources
      - path: Resources/Fonts/Bravura-OFL.txt
        buildPhase: resources
      # generated by tools/make_samples.sh
      - path: Resources/Samples
        type: folder
        buildPhase: resources
    dependencies:
      - package: AudiateCore
      - package: AudiateAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.audiate.Audiate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Audiate
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
